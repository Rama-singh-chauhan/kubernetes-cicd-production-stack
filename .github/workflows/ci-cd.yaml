name: CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r devops-infrastructure-challenge/app/requirements.txt

      - name: Run tests
        run: |
          pytest devops-infrastructure-challenge/tests/

  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t devops-backend:${{ github.sha }} \
            ./devops-infrastructure-challenge/app

  deploy:
    name: Kubernetes Deployment
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: devops-cluster

      - name: Build Docker image
        run: |
          docker build \
            -t devops-backend:${{ github.sha }} \
            ./devops-infrastructure-challenge/app

      - name: Load image into Kind
        run: |
          kind load docker-image \
            devops-backend:${{ github.sha }} \
            --name devops-cluster

      - name: Update image in Kubernetes manifest
        run: |
          sed -i \
            "s|devops-backend:latest|devops-backend:${{ github.sha }}|g" \
            devops-infrastructure-challenge/k8s/backend.yaml

      - name: Deploy namespace
        run: |
          kubectl apply \
            -f devops-infrastructure-challenge/k8s/namespace.yaml

      - name: Deploy secret
        run: |
          kubectl apply \
            -f devops-infrastructure-challenge/k8s/secret.yaml

      - name: Deploy PostgreSQL
        run: |
          kubectl apply \
            -f devops-infrastructure-challenge/k8s/postgres.yaml

      - name: Deploy backend
        run: |
          kubectl apply \
            -f devops-infrastructure-challenge/k8s/backend.yaml

      - name: Wait for PostgreSQL
        run: |
          kubectl rollout status \
            deployment/postgres \
            -n devops-demo \
            --timeout=120s

      - name: Wait for backend
        run: |
          kubectl rollout status \
            deployment/backend \
            -n devops-demo \
            --timeout=120s

      - name: Verify pods
        run: |
          kubectl get pods -n devops-demo

      - name: Verify services
        run: |
          kubectl get svc -n devops-demo

      - name: Test backend
        run: |
          kubectl run curl-test \
            --rm \
            -i \
            --restart=Never \
            --image=curlimages/curl \
            -n devops-demo \
            -- \
            curl -f http://backend:5000/healthname: CI-CD

